<!doctype html><html><head><meta charset="utf-8"><title>Polyphemus DMP</title>
<style>html,body{margin:0;height:100%;background:#02040a}iframe{width:100%;height:100%;border:0;display:block}
/* stay black until Polyphemus has loaded, then fade in (arriving from the Odysseus coin) */
#fade{position:fixed;inset:0;background:#000;pointer-events:none;z-index:20;opacity:1;transition:opacity .9s ease}#fade.gone{opacity:0}
#leave{position:fixed;inset:0;background:#000;opacity:0;z-index:10;transition:opacity .7s ease}#leave.on{opacity:1}
</style></head>
<body><div id="fade"></div><iframe id="app" src="index.html" title="Polyphemus"></iframe><script src="viewer.js" type="module"></script></body></html>
