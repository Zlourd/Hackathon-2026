<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading</title>
  <style>
    :root {
      --duration: 5000ms;

      /* Dark Blue theme (from screenshot 2) */
      --dark-bg-outer: #081022;
      --dark-bg-inner: #0f1d3b;
      --dark-border: #c9a450;
      --dark-text: #efe7d4;
      --dark-bar-track: #081126;
      --dark-bar-fill-1: #9e7e38;
      --dark-bar-fill-2: #e3c16c;

      /* Light Sand theme (from screenshot 3) */
      --sand-bg-outer: #dfd5c1;
      --sand-bg-inner: #eee6d6;
      --sand-border: #826120;
      --sand-text: #2a2115;
      --sand-bar-track: #dfd4be;
      --sand-bar-fill-1: #826120;
      --sand-bar-fill-2: #c59b41;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Cinzel", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 3vw, 36px);
      background: radial-gradient(circle at 50% 45%, var(--dark-bg-inner) 0%, var(--dark-bg-outer) 100%);
      color: var(--dark-text);
      transition: color 0.85s ease;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, var(--sand-bg-inner) 0%, var(--sand-bg-outer) 100%);
      opacity: 0;
      transition: opacity 0.9s ease-in-out;
      z-index: 0;
      pointer-events: none;
    }

    .stage.is-day::before {
      opacity: 1;
    }

    .stage.is-day {
      color: var(--sand-text);
    }

    /* Outer Greek-themed page frame */
    .page-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      height: 100%;
      border: 2px solid var(--dark-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(8, 16, 34, 0.35);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      transition: border-color 0.85s ease, background 0.85s ease, box-shadow 0.85s ease;
    }

    .stage.is-day .page-frame {
      border-color: var(--sand-border);
      background: rgba(245, 239, 226, 0.45);
      box-shadow: 0 18px 48px rgba(74, 57, 26, 0.16);
    }

    /* Top & Bottom Greek Meander Border */
    .greek-strip {
      width: 100%;
      height: 22px;
      flex-shrink: 0;
      color: var(--dark-border);
      border-bottom: 1.5px solid currentColor;
      transition: color 0.85s ease;
    }

    .greek-strip.bottom {
      border-bottom: none;
      border-top: 1.5px solid currentColor;
    }

    .stage.is-day .greek-strip {
      color: var(--sand-border);
    }

    .greek-strip svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Center Loading Area */
    .center-area {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px clamp(16px, 5vw, 64px);
    }

    /* Moon on Left (dark) & Sun on Right (light sand) */
    .celestial-row {
      width: 100%;
      max-width: 680px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      pointer-events: none;
    }

    .celestial {
      width: 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.85s ease, transform 0.9s ease;
    }

    .moon-wrap {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: drop-shadow(0 0 16px rgba(227, 193, 108, 0.45));
    }

    .stage.is-day .moon-wrap {
      opacity: 0;
      transform: translateY(10px) scale(0.82);
    }

    .sun-wrap {
      opacity: 0;
      transform: translateY(10px) scale(0.82) rotate(-25deg);
      filter: drop-shadow(0 0 14px rgba(197, 155, 65, 0.35));
    }

    .stage.is-day .sun-wrap {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(0deg);
    }

    /* Greek-Outlined Loading Bar */
    .loader-shell {
      width: 100%;
      max-width: 680px;
      padding: 6px;
      border: 2px solid var(--dark-border);
      background: var(--dark-bg-outer);
      transition: border-color 0.85s ease, background 0.85s ease;
    }

    .stage.is-day .loader-shell {
      border-color: var(--sand-border);
      background: var(--sand-bg-inner);
    }

    .bar-greek-trim {
      width: 100%;
      height: 10px;
      color: var(--dark-border);
      transition: color 0.85s ease;
    }

    .stage.is-day .bar-greek-trim {
      color: var(--sand-border);
    }

    .bar-greek-trim svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .loader-track {
      position: relative;
      width: 100%;
      height: 26px;
      margin: 4px 0;
      background: var(--dark-bar-track);
      border: 1.5px solid var(--dark-border);
      overflow: hidden;
      transition: background 0.85s ease, border-color 0.85s ease;
    }

    .stage.is-day .loader-track {
      background: var(--sand-bar-track);
      border-color: var(--sand-border);
    }

    .loader-fill {
      position: relative;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--dark-bar-fill-1), var(--dark-bar-fill-2));
      transition: background 0.85s ease;
    }

    .stage.is-day .loader-fill {
      background: linear-gradient(90deg, var(--sand-bar-fill-1), var(--sand-bar-fill-2));
    }

    .loader-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 16px,
        rgba(255, 255, 255, 0.35) 16px,
        rgba(255, 255, 255, 0.35) 18px
      );
    }

    /* Teammate Names Right Underneath the Loading Bar */
    .teammates-list {
      width: 100%;
      max-width: 680px;
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 18px;
      font-size: clamp(0.78rem, 1.8vw, 0.96rem);
      letter-spacing: 0.12em;
      text-align: center;
    }

    .teammates-list .dot {
      opacity: 0.65;
    }

    @media (max-width: 520px) {
      .teammates-list .dot {
        display: none;
      }
      .teammates-list {
        gap: 6px 16px;
      }
      .celestial {
        width: 62px;
        height: 62px;
      }
    }
  </style>
</head>
<body>
  <!-- Reusable SVG Greek Meander Patterns -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="greek-meander-lg" width="24" height="20" patternUnits="userSpaceOnUse">
        <path
          d="M0 2 H24 M0 18 H24 M2 18 V5 H18 V14 H8 V9 H13 V11"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="square"
          stroke-linejoin="miter"
        />
      </pattern>

      <pattern id="greek-meander-sm" width="14" height="10" patternUnits="userSpaceOnUse">
        <path
          d="M0 1 H14 M0 9 H14 M1.5 9 V3 H10.5 V7 H5 V5 H7.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
          stroke-linecap="square"
        />
      </pattern>
    </defs>
  </svg>

  <main class="stage" id="stage">
    <div class="page-frame">
      <!-- Top Greek Meander Border -->
      <div class="greek-strip" aria-hidden="true">
        <svg preserveAspectRatio="none">
          <rect width="100%" height="100%" fill="url(#greek-meander-lg)" />
        </svg>
      </div>

      <!-- Center Content -->
      <section class="center-area" aria-label="Loading">
        <!-- Moon on Left (Dark) & Sun on Right (Light Sand) -->
        <div class="celestial-row">
          <div class="celestial moon-wrap" aria-label="Moon">
            <svg viewBox="0 0 80 80" width="100%" height="100%">
              <path
                d="M48 12 A28 28 0 1 0 68 54 A22 22 0 1 1 48 12 Z"
                fill="#ebd18c"
                stroke="#c9a450"
                stroke-width="2"
              />
              <path d="M62 18 L64 23 L69 25 L64 27 L62 32 L60 27 L55 25 L60 23 Z" fill="#ebd18c" opacity="0.85" />
            </svg>
          </div>

          <div class="celestial sun-wrap" aria-label="Sun">
            <svg viewBox="0 0 80 80" width="100%" height="100%">
              <circle cx="40" cy="40" r="16" fill="#d4a038" stroke="#826120" stroke-width="2" />
              <g stroke="#826120" stroke-width="2.2" stroke-linecap="round">
                <line x1="40" y1="8" x2="40" y2="18" />
                <line x1="40" y1="62" x2="40" y2="72" />
                <line x1="8" y1="40" x2="18" y2="40" />
                <line x1="62" y1="40" x2="72" y2="40" />
                <line x1="17.4" y1="17.4" x2="24.5" y2="24.5" />
                <line x1="55.5" y1="55.5" x2="62.6" y2="62.6" />
                <line x1="62.6" y1="17.4" x2="55.5" y2="24.5" />
                <line x1="24.5" y1="55.5" x2="17.4" y2="62.6" />
              </g>
            </svg>
          </div>
        </div>

        <!-- Greek-Outlined Loading Bar -->
        <div class="loader-shell">
          <div class="bar-greek-trim" aria-hidden="true">
            <svg preserveAspectRatio="none">
              <rect width="100%" height="100%" fill="url(#greek-meander-sm)" />
            </svg>
          </div>

          <div
            class="loader-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            id="progress-track"
          >
            <div class="loader-fill" id="loader-fill"></div>
          </div>

          <div class="bar-greek-trim" aria-hidden="true">
            <svg preserveAspectRatio="none">
              <rect width="100%" height="100%" fill="url(#greek-meander-sm)" />
            </svg>
          </div>
        </div>

        <!-- Names Right Underneath the Loading Bar (Alphabetical by First Name) -->
        <div class="teammates-list">
          <span>Agrima P.</span>
          <span class="dot" aria-hidden="true">•</span>
          <span>Edgar B.</span>
          <span class="dot" aria-hidden="true">•</span>
          <span>Shalom K.</span>
          <span class="dot" aria-hidden="true">•</span>
          <span>Sterling C.</span>
        </div>
      </section>

      <!-- Bottom Greek Meander Border -->
      <div class="greek-strip bottom" aria-hidden="true">
        <svg preserveAspectRatio="none">
          <rect width="100%" height="100%" fill="url(#greek-meander-lg)" />
        </svg>
      </div>
    </div>
  </main>

  <script>
    const TOTAL_MS = 5000;
    const SWITCH_AT = 0.44; // Switches from dark blue to light sand smoothly mid-load (~2.2s)

    const stage = document.getElementById("stage");
    const loaderFill = document.getElementById("loader-fill");
    const progressTrack = document.getElementById("progress-track");

    let rafId = null;

    function startLoading() {
      if (rafId) cancelAnimationFrame(rafId);

      stage.classList.remove("is-day");
      loaderFill.style.width = "0%";
      progressTrack.setAttribute("aria-valuenow", "0");

      const startTime = performance.now();
      let switchedToDay = false;

      function tick(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / TOTAL_MS, 1);
        const pct = Math.round(progress * 100);

        loaderFill.style.width = (progress * 100).toFixed(2) + "%";
        progressTrack.setAttribute("aria-valuenow", String(pct));

        if (!switchedToDay && progress >= SWITCH_AT) {
          switchedToDay = true;
          stage.classList.add("is-day");
        }

        if (progress < 1) {
          rafId = requestAnimationFrame(tick);
        }
      }

      rafId = requestAnimationFrame(tick);
    }

    window.addEventListener("DOMContentLoaded", startLoading);
  </script>
</body>
</html>
